version: '3.8'

services:
  # 0. Local PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: sl-postgres
    restart: always
    environment:
      POSTGRES_DB: d34gj8i1b0knkt
      POSTGRES_USER: ud8op8v4fm53g1
      POSTGRES_PASSWORD: p7bb7ef0c3df8a6e9031249215b1ed754f5c44d99d8f256bba9ad5645bd861723
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ud8op8v4fm53g1 -d d34gj8i1b0knkt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 1. Private MinIO S3 Object Storage Service (No exposed ports to public)
  minio:
    image: minio/minio:latest
    container_name: sl-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 3. StoryLegends Backend API (Private Container - Proxied via Nginx)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sl-backend
    restart: always
    environment:
      SPRING_SECURITY_KEY: ${SPRING_SECURITY_KEY:-defaultSecretKeyForStoryLegendsProductionAndTesting123456}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/d34gj8i1b0knkt
      SPRING_DATASOURCE_USERNAME: ud8op8v4fm53g1
      SPRING_DATASOURCE_PASSWORD: p7bb7ef0c3df8a6e9031249215b1ed754f5c44d99d8f256bba9ad5645bd861723
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://test.storylegends.xyz,https://test.storylegends.xyz,http://localhost:5173,http://localhost:5174}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-storylegends-assets}
      MINECRAFT_NODE_PATH: ./minecraft_node_data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - minecraft_node_data:/app/minecraft_node_data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 4. StoryLegends Frontend (Single Domain Nginx Web Server + API Proxy)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sl-frontend
    restart: always
    ports:
      - "5174:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  minecraft_node_data:
