version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sl_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-slbackend}
      POSTGRES_USER: ${POSTGRES_USER:-sluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sluser} -d ${POSTGRES_DB:-slbackend}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sl_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: sl_minio_init
    depends_on:
      - minio
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD); do echo 'Waiting for MinIO...'; sleep 2; done;
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-storylegends-uploads} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-storylegends-uploads};
      echo 'MinIO bucket ${MINIO_BUCKET_NAME:-storylegends-uploads} created and configured for public download.';
      exit 0;
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sl_backend
    restart: always
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-slbackend}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sluser}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-slpassword}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secret_password}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-storylegends-uploads}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/storylegends-uploads}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sl_frontend
    restart: always
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
