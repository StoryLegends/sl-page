name: Deploy to VPS Server

on:
  push:
    branches:
      - main
      - feature/docker-minecraft-panel

jobs:
  deploy:
    name: Deploy StoryLegends Stack via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }} # e.g. 144.31.16.217
          username: ${{ secrets.VPS_USER }} # e.g. datapeice
          key: ${{ secrets.VPS_SSH_KEY }} # SSH Private Key
          script: |
            cd ~/dockers/sl-page
            git pull origin feature/docker-minecraft-panel || git pull origin main
            docker compose up -d --build
